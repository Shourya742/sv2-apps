services:
  pool_sv2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: pool_sv2
    image: stratumv2/pool_sv2:hotpath
    container_name: pool_sv2
    stop_signal: SIGINT
    env_file:
      - docker_env
    volumes:
      - ./config/pool-jds-config.toml.template:/app/pool-jds-config.toml.template:ro
      - "${BITCOIN_SOCKET_PATH?}:/root/.bitcoin/node.sock"
    entrypoint: >
      sh -c '
        socat TCP-LISTEN:6771,fork,bind=0.0.0.0,reuseaddr TCP:127.0.0.1:6770 &
        envsubst < /app/pool-jds-config.toml.template> /app/pool-config.toml &&
        exec /app/pool_sv2
      '
    ports:
      - "3333:3333"
      - "3334:3334"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:6770:6771" # Hotpath
    restart: unless-stopped
    profiles:
      - pool_and_miner_apps_no_jd
      - pool_apps
      - pool_and_miner_apps

  jd_client_sv2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: jd_client_sv2
    image: stratumv2/jd_client_sv2:hotpath
    container_name: jd_client_sv2
    stop_signal: SIGINT
    env_file:
      - docker_env
    volumes:
      - ./config/jdc-config.toml.template:/app/jdc-config.toml.template:ro
      - "${BITCOIN_SOCKET_PATH?}:/root/.bitcoin/node.sock"
    entrypoint: >
      sh -c '
        socat TCP-LISTEN:6771,fork,bind=0.0.0.0,reuseaddr TCP:127.0.0.1:6770 &
        envsubst < /app/jdc-config.toml.template> /app/jdc-config.toml &&
        exec /app/jd_client_sv2
      '
    ports:
      - "34265:34265"
      - "9091:9091"  # Monitoring HTTP API & Prometheus metrics
      - "127.0.0.1:6772:6771" # Hotpath
    restart: unless-stopped
    profiles:
      - miner_apps
      - pool_and_miner_apps

  tproxy_sv2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: translator_sv2
    image: stratumv2/translator_sv2:hotpath
    container_name: tproxy_sv2
    stop_signal: SIGINT
    env_file:
      - docker_env
    volumes:
      - ./config/translator-proxy-config.toml.template:/app/proxy-config.toml.template:ro
    entrypoint: >
      sh -c '
        socat TCP-LISTEN:6771,fork,bind=0.0.0.0,reuseaddr TCP:127.0.0.1:6770 &
        envsubst < /app/proxy-config.toml.template > /app/translator-config.toml &&
        exec /app/translator_sv2
      '
    ports:
      - "34255:34255"
      - "9092:9092"  # Monitoring HTTP API & Prometheus metrics
      - "127.0.0.1:6773:6771" # Hotpath
    restart: unless-stopped
    profiles:
      - pool_and_miner_apps_no_jd
      - tproxy
      - miner_apps
      - pool_and_miner_apps

networks:
  sv2_apps:
